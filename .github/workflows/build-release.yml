name: Build and release macOS trainer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-trainer-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build, test and package (Apple Silicon)
    runs-on: macos-26
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify native build environment
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          echo "MT_TRAINER_BUILD_DIR=$RUNNER_TEMP/CrimsonDesertTrainer-Build" >> "$GITHUB_ENV"
      - name: Build and run regression checks
        run: ./script/build_and_run.sh --build-only
      - name: Package and verify extracted app
        run: python3 -B script/package_release.py "$RUNNER_TEMP/CrimsonDesertTrainer-Release"
      - name: Upload verified release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CrimsonDesertTrainer-macOS-arm64
          path: ${{ runner.temp }}/CrimsonDesertTrainer-Release/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    name: Publish versioned release
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download verified release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: CrimsonDesertTrainer-macOS-arm64
          path: release
      - name: Verify release checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish app, installation notes and checksums
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" Crimson-Desert-Trainer-macOS-arm64.zip INSTALLATION.txt SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" Crimson-Desert-Trainer-macOS-arm64.zip INSTALLATION.txt SHA256SUMS.txt --verify-tag --title "Crimson Desert Trainer $RELEASE_TAG" --notes-file RELEASE_NOTES.md
          fi
